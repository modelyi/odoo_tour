[options]
; === Core ===
; master 口令（数据库管理器口令）以 PBKDF2-SHA512(600k rounds) 哈希存放。
; 明文只在 .env 的 ADMIN_PASSWD 里，不进 git；改口令：
;   printf '%s' '新口令' | docker exec -i tms-odoo python3 -c \
;     "import sys;from odoo.tools.config import crypt_context;print(crypt_context.hash(sys.stdin.read()))"
admin_passwd = $pbkdf2-sha512$600000$sHaudU5JKaWUci6lVKpVKg$9fgiTuRD6BL2K00.cIZ7puLhwKenI3zmwrsoltXhPUHuNEp2Wzm0gRiQ084Fce.uia/iNmw5oQR9k2iZQuDZmw

; === Database ===
; 主机/端口/用户是拓扑信息，留在本文件；**口令不落本文件**（历史上它进过 git，已轮换）。
; Odoo 19 的 --db_password 会回落读环境变量 PGPASSWORD（见 tools/config.py 的 env_name），
; 值来自 .env -> docker-compose 的 PG* 环境变量，因此 `docker exec tms-odoo odoo ...` 也生效。
db_host = db
db_port = 5432
db_user = odoo
db_name = False
; [A1 唯一差异项] 本实例只有单库 tour19（tms 的租户库不进平桥：tour_saas 在 B1 已判定
; 停用 —— 全仓无模块依赖它、租户表仅 1 行测试数据）。dbfilter 命中恰好 1 个库 ⇒ Odoo
; 自动选定该库，不需要 /web/database/selector。
; list_db 有意保持与 tms 一致的 True：A1 的铁律是"纯复制、不掺配置变更"，收单库
; （list_db=False）放到 A2/B3 作为独立变更项做回归。管理端点由 nginx 层封锁（同 tms）。
dbfilter = ^tour19$
; list_db 仍为 True：tour_saas 的租户库要靠 /web/database/selector 进入（单库自动选定
; 只在 dbfilter 命中恰好 1 个库时生效）。/web/database/manager 等建库/删除端点已在
; nginx 层对本机以外关闭（见 nginx/ 与 d-交付验收/A0 报告），B3 停用 tour_saas 后
; 再把这里改成 list_db = False + dbfilter = ^tms$ 收成单库。
list_db = True
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; === Network ===
proxy_mode = True
xmlrpc_interface = 0.0.0.0
xmlrpc_port = 8069
longpolling_port = 8072
workers = 2
max_cron_threads = 1
limit_time_cpu = 1800
limit_time_real = 3600
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; === Session / Cache ===
; session_redis_url = redis://redis:6379/0

; === Logging ===
logfile = /tmp/odoo-server.log
log_level = info
log_handler = :INFO
log_db = False

; === Security ===
server_wide_modules = base,web

; === Dev ===
dev_mode = reload,qweb
