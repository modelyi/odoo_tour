# /etc/nginx/conf.d/tour-staging.solepro.cloud.conf
# [A1 平桥验收] tour-staging.solepro.cloud → tour-odoo（Odoo 19 平桥副本，127.0.0.1:8071）
# 只用于验收；A1 gate 通过后 tour.solepro.cloud 的 upstream 指向同一个 8071，本域名随后停用。
# 注意：solepro.cloud 无泛解析，本 vhost 生效前提是 Cloudflare 加了 tour-staging 记录；
# 记录未就位时可用 curl --resolve tour-staging.solepro.cloud:443:127.0.0.1 验证（本机已验证）。

map $http_upgrade $connection_upgrade_tour_staging {
    default upgrade;
    ''      '';
}

upstream tour_odoo_a1 {
    server 127.0.0.1:8071;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tour-staging.solepro.cloud;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tour-staging.solepro.cloud;

    ssl_certificate     /etc/nginx/ssl/solepro.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/solepro.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 200m;

    # 与 tms 同口径的纵深防御（本实例 list_db=True 只为与现网逐字节一致，见 config/odoo.conf）
    location ~ ^/web/database/(manager|create|backup|duplicate|restore|destroy|list)$ {
        deny all;
        return 404;
    }

    location /websocket {
        proxy_pass http://tour_odoo_a1;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tour_staging;
        proxy_read_timeout 720s;
    }

    location /longpolling {
        proxy_pass http://tour_odoo_a1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tour_odoo_a1;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tour_staging;
        proxy_read_timeout    720s;
        proxy_send_timeout    720s;
        proxy_connect_timeout 10s;

        gzip on;
        gzip_types text/css text/plain application/json application/javascript text/xml application/xml;
        gzip_min_length 1000;
    }
}
