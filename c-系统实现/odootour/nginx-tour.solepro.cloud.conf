# /etc/nginx/conf.d/tour.solepro.cloud.conf
# 2026-09-25 odootour 重装：停用页(503)撤销，域名指向自建 Odoo 20 docker 实例
# （c-系统实现/odootour，容器 odootour-odoo，127.0.0.1:8079）。
# 上一形态备份：tour.solepro.cloud.conf.bak.odootour-reinstall；再前态 .bak.a0-4.055625。
# Cloudflare Origin 证书（*.solepro.cloud），SSL mode = Full (strict)

map $http_upgrade $connection_upgrade_tour {
    default upgrade;
    ''      '';
}

upstream odoo20_app {
    server 127.0.0.1:8079;   # odootour-odoo → 8069
    keepalive 32;
}

upstream odoo20_gevent {
    server 127.0.0.1:8078;   # odootour-odoo → 8072 (gevent)
}

server {
    listen 80;
    listen [::]:80;
    server_name tour.solepro.cloud;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tour.solepro.cloud;

    ssl_certificate     /etc/nginx/ssl/solepro.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/solepro.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 200m;

    # 与 tms/tour-staging 同口径纵深防御（本实例 odoo.conf 已 list_db=False）
    location ~ ^/web/database/(manager|create|backup|duplicate|restore|destroy|list)$ {
        deny all;
        return 404;
    }

    location /websocket {
        proxy_pass http://odoo20_gevent;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tour;
        proxy_read_timeout  720s;
    }

    location /longpolling {
        proxy_pass http://odoo20_gevent;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://odoo20_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tour;
        proxy_read_timeout    720s;
        proxy_send_timeout    720s;
        proxy_connect_timeout 10s;
    }
}
