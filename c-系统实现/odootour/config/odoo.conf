[options]
; odootour / tour.solepro.cloud —— Odoo 20 生产（core only 阶段）
; 与 tour-platform(19 平桥) 的差异：无 dev_mode、list_db=False（库用 CLI 初始化）。
admin_passwd = $pbkdf2-sha512$placeholder$REPLACE_AT_INIT
db_host = db
db_port = 5432
db_user = odoo
db_name = tour20
dbfilter = ^tour20$
list_db = False
addons_path = /usr/lib/odoo/odoo-server/addons,/usr/lib/odoo/odoo-server/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
http_port = 8069
gevent_port = 8072
proxy_mode = True
workers = 2
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
log_handler = :INFO
