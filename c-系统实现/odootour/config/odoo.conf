[options]
; odootour / tour.solepro.cloud —— Odoo 20 生产（core only 阶段）
; 与 tour-platform(19 平桥) 的差异：无 dev_mode、list_db=False（库用 CLI 初始化）。
admin_passwd = $pbkdf2-sha512$25000$GiPEOCcE4Nz737tXaq2Vcg$d8of2u.letY.3yAuqYvbjTl.W.ToVpRhChJu6i9eedyH9iNaz4IEz5Zt/cJwthnVjqiILUkfx1l8alVRgWhM6g
db_host = db
db_port = 5432
db_user = odoo
db_name = tour20
dbfilter = ^tour20$
