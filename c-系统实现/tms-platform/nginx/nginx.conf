upstream odoo {
    server odoo:8069;
}
upstream odoo-chat {
    server odoo:8072;
}

# HTTP -> HTTPS redirect (uncomment after SSL cert is installed)
# server {
#     listen 80;
#     server_name tms.solepro.cloud;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;   # enable after SSL
    server_name tms.solepro.cloud;

    # SSL (uncomment after cert installed)
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/tms.access.log;
    error_log  /var/log/nginx/tms.error.log;

    proxy_read_timeout    720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout    720s;
    proxy_set_header      X-Forwarded-Host $host;
    proxy_set_header      X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_set_header      X-Real-IP        $remote_addr;
    proxy_set_header      Host             $host;
    proxy_redirect        off;

    # Longpolling (websocket for chat / live updates)
    location /longpolling {
        proxy_pass http://odoo-chat;
    }
    location /websocket {
        proxy_pass http://odoo-chat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets caching
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        proxy_cache off;
        expires 864000;
        proxy_pass http://odoo;
    }

    # Gzip
    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/javascript application/json;
    gzip_min_length 1000;

    client_max_body_size 200m;

    location / {
        proxy_pass http://odoo;
    }
}
